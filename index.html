<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Registration Form</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous"
    />

    <!-- Custom CSS -->
    <link href="./css/style.css" rel="stylesheet" />

    <!-- Bootstrap JavaScript -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
      crossorigin="anonymous"
    ></script>

    <!-- Custom JavaScript -->
    <script src="./scripts/script.js" defer></script>
  </head>

  <body class="p-3">
    <div class="mx-auto vstack gap-2" style="width: 400px">
      <h3 class="text-center">Registration</h3>

      <!-- First name and Last name -->
      <div class="d-flex gap-2">
        <div>
          <label for="first-name-input" class="form-label"> First name </label>

          <input
            class="form-control"
            id="first-name-input"
            placeholder="First name"
          />

          <div class="invalid-feedback">Invalid first name</div>
        </div>

        <div>
          <label for="last-name-input" class="form-label"> Last name </label>

          <input
            class="form-control"
            id="last-name-input"
            placeholder="Last name"
          />

          <div class="invalid-feedback">Invalid last name</div>
        </div>
      </div>

      <!-- Email -->
      <div>
        <label for="email-input" class="form-label"> Email </label>

        <input class="form-control" id="email-input" placeholder="Email" />

        <div class="invalid-feedback">Invalid email format</div>
      </div>

      <!-- Password -->
      <div>
        <label for="password-input" class="form-label"> Password </label>

        <input
          class="form-control"
          type="password"
          id="password-input"
          placeholder="Password"
        />

        <div class="invalid-feedback">Require at least 6 characters</div>
      </div>

      <!-- Confirm Password -->
      <div>
        <label for="password-confirm-input" class="form-label">
          Confirm Password
        </label>

        <input
          class="form-control"
          type="password"
          id="password-confirm-input"
          placeholder="Confirm Password"
        />

        <div class="invalid-feedback">
          Password mismatch or invalid password
        </div>
      </div>

      <!-- Buttons -->
      <div class="d-flex justify-content-end gap-2">
        <button type="button" id="reset-btn" class="btn btn-danger my-2">
          Reset
        </button>

        <button type="button" id="submit-btn" class="btn btn-success my-2">
          Register
        </button>
      </div>
    </div>
  </body>
</html>
